dependencies:
  idf: ">=5.4"
  # LVGL 9.6.0 adds a deprecation #warning to the legacy src/ headers that
  # esp_lvgl_adapter 0.6.x includes; ESP-IDF v6.0 builds with -Werror=cpp,
  # which turns those #warnings into errors. Pin to the last clean 9.x.
  lvgl/lvgl: "9.5.0"
  espressif/esp_lcd_sh8601: "^2.0"
  espressif/esp_lcd_touch_ft5x06: "^1.1"
  espressif/esp_lcd_touch_cst816s: "^1.0"
  # Waveshare ESP32-P4-WIFI6-Touch-LCD-4B board support (ST7703 MIPI-DSI +
  # GT911 touch + ES8311). Linked in the 4B build (see CMakeLists.txt).
  # WiFi/C6 (esp_hosted / esp_wifi_remote) are intentionally NOT here: the
  # tank is offline and the LLM runs on-device.
  waveshare/esp32_p4_wifi6_touch_lcd_4b:
    version: "^3.0.1"
    rules:
      - if: target in [esp32p4]
