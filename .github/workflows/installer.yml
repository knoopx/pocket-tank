# Browser installer, autodeployed to GitHub Pages on every push to main that
# touches the firmware, the shared tank code, the model, the installer page
# or the assembler: build the firmware with the project's ESP-IDF, install
# the ESP Web Tools bundle with bun (it is not kept in the repo), assemble
# installer/dist (page + manifests + binaries + flasher) and publish the
# folder to the gh-pages branch. The site is served at
# https://knoopx.github.io/pocket-tank-p4/ - no CNAME, the default Pages URL.
#
# The deploy fetches the gh-pages branch into a worktree, builds over it and
# pushes it back. The page fetches its manifest from its own origin, so a
# button on any other site pointing at this manifest always offers the
# firmware of the latest push.
name: installer

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "common/**"
      - "model/out/**"
      - "installer/**"
      - "tools/make_installer.py"
      - ".github/workflows/installer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git describe wants the tags

      # v6.0: the v5.5 image bundles idf-component-manager 2.2.2, which crashes
      # (MissingKconfigError) on the LVGL manifest $CONFIG{...} if-clauses at the
      # first fresh-checkout build; v6.0 ships >=2.3.0 with the catch (MR !518).
      - name: Build the firmware (ESP-IDF v6.0, esp32p4)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0
          target: esp32p4
          path: firmware

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Get bun cache directory path
        id: bun-cache-dir-path
        run: echo "dir=$(bun pm cache path)" >> "$GITHUB_OUTPUT"

      - name: Cache bun dependencies
        uses: actions/cache@v4
        id: bun-cache
        with:
          path: ${{ steps.bun-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-bun-${{ hashFiles('installer/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install the flasher bundle
        run: cd installer && bun install --frozen-lockfile

      - name: Assemble the installer
        run: |
          python3 tools/make_installer.py --build-dir firmware/build --out installer/dist
          ls -la installer/dist installer/dist/firmware

      - name: Setup git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # first run: the remote has no gh-pages branch yet, start it from main
          git fetch --no-tags --prune --depth=1 origin gh-pages || git branch gh-pages
          git worktree add dist gh-pages

      - name: Publish to the gh-pages branch
        run: |
          find dist -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a installer/dist/. dist/
          cd dist
          git add -f .
          git commit -m "$(date +%Y%m%d)" || true
          git push -f origin HEAD:gh-pages
